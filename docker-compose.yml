
services:
  db:
    image: postgres:16
    container_name: nexo-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: nexo
      POSTGRES_USER: nexo_app
      POSTGRES_PASSWORD: nexo_local_dev_password
    ports:
      - "5432:5432"
    volumes:
      - nexo_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexo_app -d nexo"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  nexo_postgres_data:
